name: AttendChain CI Pipeline

on:
  push:
    branches: ["main", "ticket/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: 1. Lint, Format & TypeScript Strict Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  contract-tests-and-gas:
    name: 2. Smart Contract Tests, Coverage & Gas Budgets
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run contracts:compile
      - run: npm run test:contracts
        env:
          REPORT_GAS: "true"
      - run: npm run test:contracts:coverage

  unit-and-integration-tests:
    name: 3. Unit & API Integration Tests (Coverage Gate)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage

  e2e-and-a11y:
    name: 4. Playwright E2E Journeys & WCAG 2.2 AA Audit
    runs-on: ubuntu-latest
    needs: [contract-tests-and-gas, unit-and-integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
